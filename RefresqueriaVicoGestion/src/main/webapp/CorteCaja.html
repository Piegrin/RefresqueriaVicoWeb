<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corte de Caja - Refresquería Vico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-xl flex flex-col justify-between hidden md:flex">
        <div>
            <div class="h-20 flex items-center justify-center border-b border-gray-100">
                <h1 class="text-2xl font-bold text-gray-800">
                    <i class="fa-solid fa-bottle-water text-yellow-500 mr-2"></i> Vico Admin
                </h1>
            </div>
            <nav class="p-4 space-y-2">
                <a href="MainMenu.html" class="flex items-center text-gray-600 hover:bg-yellow-50 hover:text-yellow-600 rounded-xl px-4 py-3 transition">
                    <i class="fa-solid fa-house w-6"></i> Inicio
                </a>
                <a href="MenuVentas.html" class="flex items-center text-gray-600 hover:bg-yellow-50 hover:text-yellow-600 rounded-xl px-4 py-3 transition">
                    <i class="fa-solid fa-cash-register w-6"></i> Punto de Venta
                </a>
                <a href="CorteCaja.html" class="flex items-center text-yellow-600 bg-yellow-50 rounded-xl px-4 py-3 font-medium transition">
                    <i class="fa-solid fa-chart-line w-6"></i> Corte de Caja
                </a>
                <a href="ConsultaProd.html" class="flex items-center text-gray-600 hover:bg-yellow-50 hover:text-yellow-600 rounded-xl px-4 py-3 transition">
                    <i class="fa-solid fa-boxes-stacked w-6"></i> Inventario
                </a>
                <a href="MenuConsultas.html" class="flex items-center text-gray-600 hover:bg-yellow-50 hover:text-yellow-600 rounded-xl px-4 py-3 transition">
                    <i class="fa-solid fa-users-gear w-6"></i> Empleados
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-gray-100">
            <button onclick="cerrarSesion()" class="flex items-center text-red-500 hover:bg-red-50 w-full rounded-xl px-4 py-3 transition">
                <i class="fa-solid fa-right-from-bracket w-6"></i> Salir al Home
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <!-- Topbar -->
        <header class="h-20 bg-white shadow-sm flex items-center justify-between px-8 z-10">
            <h2 class="text-2xl font-bold text-gray-800">Historial y Corte de Caja</h2>
            <div class="flex items-center space-x-4">
                <div class="w-10 h-10 rounded-full bg-yellow-100 flex items-center justify-center text-yellow-600 font-bold">
                    A
                </div>
                <span class="font-medium text-gray-700" id="adminName">Admin</span>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="px-8 py-6 grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex items-center">
                <div class="w-14 h-14 rounded-full bg-green-100 flex items-center justify-center text-green-600 text-2xl mr-4">
                    <i class="fa-solid fa-sack-dollar"></i>
                </div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">Total Acumulado en Caja</p>
                    <h3 class="text-2xl font-bold text-gray-800" id="totalCaja">$0.00</h3>
                </div>
            </div>
            
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex items-center">
                <div class="w-14 h-14 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-2xl mr-4">
                    <i class="fa-solid fa-receipt"></i>
                </div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">Transacciones Totales</p>
                    <h3 class="text-2xl font-bold text-gray-800" id="totalTransacciones">0</h3>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-medium">Estado de Caja</p>
                    <h3 class="text-xl font-bold text-green-500">Cuadrada y Activa</h3>
                </div>
                <button onclick="imprimirCorte()" class="bg-gray-900 text-white px-4 py-2 rounded-xl text-sm hover:bg-gray-800 transition">
                    <i class="fa-solid fa-print mr-2"></i> Imprimir
                </button>
            </div>
        </div>

        <!-- Table -->
        <div class="flex-1 px-8 pb-8 overflow-hidden flex flex-col">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 flex-1 flex flex-col overflow-hidden">
                <div class="overflow-y-auto flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 sticky top-0 z-10 shadow-sm">
                            <tr>
                                <th class="py-4 px-6 text-sm font-semibold text-gray-500">ID / Fecha</th>
                                <th class="py-4 px-6 text-sm font-semibold text-gray-500">Cliente / Empleado</th>
                                <th class="py-4 px-6 text-sm font-semibold text-gray-500">Monto Entregado</th>
                                <th class="py-4 px-6 text-sm font-semibold text-gray-500">Cambio</th>
                                <th class="py-4 px-6 text-sm font-semibold text-gray-500">Moneda</th>
                                <th class="py-4 px-6 text-sm font-semibold text-gray-500">Total Venta</th>
                            </tr>
                        </thead>
                        <tbody id="tablaVentas" class="divide-y divide-gray-100">
                            <!-- Filas de ventas -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'api/ventas';

        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('rol') !== 'Administrador') {
                window.location.href = 'home.html';
                return;
            }
            document.getElementById('adminName').textContent = sessionStorage.getItem('nombreUsuario') || 'Admin';
            cargarHistorial();
        });

        function cerrarSesion() {
            window.location.href = 'home.html';
        }

        async function cargarHistorial() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error("Error al obtener las ventas");
                const ventas = await res.json();

                const tbody = document.getElementById("tablaVentas");
                tbody.innerHTML = "";

                let totalAcumuladoMXN = 0; let totalAcumuladoUSD = 0;

                ventas.forEach(v => {
                    if ((v.moneda || "MXN") === "MXN") { totalAcumuladoMXN += v.montoTotal; } else { totalAcumuladoUSD += (v.montoEntregado - v.cambio); }

                    const tr = document.createElement("tr");
                    tr.className = "hover:bg-gray-50 transition";
                    
                    const fecha = new Date(v.fechaCreacion).toLocaleString();
                    const clienteStr = v.cliente ? v.cliente.nombre : "Mostrador";
                    const empleadoStr = v.empleado ? v.empleado.nombre : "Sistema";

                    // Manejo de nulos (viejas ventas antes del alter table)
                    const moneda = v.moneda || "MXN";
                    const entregado = v.montoEntregado ? v.montoEntregado.toFixed(2) : v.montoTotal.toFixed(2);
                    const cambio = v.cambio ? v.cambio.toFixed(2) : "0.00";

                    tr.innerHTML = `
                        <td class="py-4 px-6">
                            <span class="font-bold text-gray-800">#${v.ventaID}</span><br>
                            <span class="text-xs text-gray-500">${fecha}</span>
                        </td>
                        <td class="py-4 px-6">
                            <span class="text-sm font-medium">Cli: ${clienteStr}</span><br>
                            <span class="text-xs text-gray-500">Emp: ${empleadoStr}</span>
                        </td>
                        <td class="py-4 px-6 font-medium text-gray-600">
                            $${entregado}
                        </td>
                        <td class="py-4 px-6 text-sm text-gray-500">
                            $${cambio}
                        </td>
                        <td class="py-4 px-6">
                            <span class="px-2 py-1 bg-gray-100 text-gray-600 rounded-lg text-xs font-bold">${moneda}</span>
                        </td>
                        <td class="py-4 px-6 text-lg font-bold text-green-600">
                            $${v.montoTotal.toFixed(2)}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById("totalTransacciones").textContent = ventas.length;
                document.getElementById("totalCaja").textContent = "$" + totalAcumulado.toFixed(2);

            } catch (e) {
                console.error(e);
            }
        }

        function imprimirCorte() {
            window.print();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Refresquería Vico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between">

    <!-- NAVBAR SIMPLE -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="home.html" class="flex items-center space-x-2">
                <i class="fa-solid fa-glass-water text-3xl text-yellow-500"></i>
                <span class="text-2xl font-black tracking-tight text-gray-900">Refresquería <span class="text-yellow-500">Vico</span></span>
            </a>
            <a href="home.html" class="text-sm font-medium text-blue-600 hover:text-blue-800 transition">
                &larr; Volver a la tienda
            </a>
        </div>
    </header>

    <!-- MAIN FORM -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="bg-yellow-400 py-6 text-center">
                <h2 class="text-3xl font-extrabold text-gray-900">¡Hola!</h2>
                <p class="text-gray-800 mt-2 font-medium">Ingresa para ver tus pedidos y ofertas</p>
            </div>
            
            <div class="p-8">
                <form class="space-y-6" id="loginForm" onsubmit="event.preventDefault(); loginDemo();">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Correo Electrónico o Teléfono</label>
                        <div class="mt-1 relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-regular fa-envelope text-gray-400"></i>
                            </div>
                            <input id="email" name="email" type="text" autocomplete="username" required class="appearance-none block w-full pl-10 px-3 py-3 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-yellow-500 focus:border-yellow-500 sm:text-sm" placeholder="ejemplo@correo.com o 6641000001">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
                        <div class="mt-1 relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-lock text-gray-400"></i>
                            </div>
                            <input id="password" name="password" type="password" autocomplete="current-password" required class="appearance-none block w-full pl-10 px-3 py-3 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-yellow-500 focus:border-yellow-500 sm:text-sm" placeholder="••••••••">
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-yellow-600 focus:ring-yellow-500 border-gray-300 rounded">
                            <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                                Recordarme
                            </label>
                        </div>

                        <div class="text-sm">
                            <a href="#" class="font-medium text-blue-600 hover:text-blue-500">
                                ¿Olvidaste tu contraseña?
                            </a>
                        </div>
                    </div>

                    <div>
                        <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-gray-900 bg-yellow-400 hover:bg-yellow-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500 transition-colors">
                            Iniciar Sesión
                        </button>
                    </div>
                </form>

                <div class="mt-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white text-gray-500">
                                ¿Eres nuevo en Refresquería Vico?
                            </span>
                        </div>
                    </div>

                    <div class="mt-6">
                        <a href="Registro.html" class="w-full flex justify-center py-3 px-4 border-2 border-gray-200 rounded-xl shadow-sm text-sm font-bold text-gray-700 bg-white hover:bg-gray-50 transition-colors">
                            Crear cuenta
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER SIMPLE -->
    <footer class="bg-gray-900 py-6 text-center text-sm text-gray-500">
        &copy; 2026 Refresquería Vico. Todos los derechos reservados.
    </footer>

    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        async function loginDemo() {
            let email = document.getElementById('email').value.trim();
            let pass = document.getElementById('password').value.trim();
            
            if(!email || !pass) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Campos incompletos',
                    text: 'Por favor, llena tu correo y contraseña.',
                    confirmButtonColor: '#eab308'
                });
                return;
            }

            try {
                const response = await fetch('api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identificador: email, correo: email, contrasena: pass })
                });

                const data = await response.json();
                
                if (response.ok && data.exito) {
                    sessionStorage.setItem('usuarioID', data.usuarioID);
                    sessionStorage.setItem('nombre', data.nombre);
                    if (data.correo) sessionStorage.setItem('correo', data.correo);
                    sessionStorage.setItem('rol', data.rol || 'Cliente');
                    if (data.rolID) sessionStorage.setItem('rolID', data.rolID);

                    let destino = 'home.html';
                    if (data.rol === 'Administrador') {
                        destino = 'MainMenu.html';
                    } else if (data.rol === 'Empleado') {
                        destino = 'MenuVentas.html';
                    }

                    Swal.fire({
                        icon: 'success',
                        title: 'Bienvenido',
                        text: data.mensaje,
                        showConfirmButton: false,
                        timer: 1200
                    }).then(() => {
                        window.location.href = destino;
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: data.mensaje || "Credenciales incorrectas",
                        confirmButtonColor: '#eab308'
                    });
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error de conexión',
                    text: 'No se pudo conectar con el servidor.',
                    confirmButtonColor: '#eab308'
                });
                console.error(error);
            }
        }
    </script>
</body>
</html>

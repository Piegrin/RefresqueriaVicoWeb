<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito | Refresquería Vico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- NAVBAR SIMPLE -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="home.html" class="flex items-center space-x-2">
                <i class="fa-solid fa-glass-water text-3xl text-yellow-500"></i>
                <span class="text-2xl font-black tracking-tight text-gray-900">Refresquería <span class="text-yellow-500">Vico</span></span>
            </a>
            <a href="home.html" class="text-sm font-medium text-gray-600 hover:text-gray-900 transition flex items-center">
                <i class="fa-solid fa-arrow-left mr-2"></i> Seguir comprando
            </a>
        </div>
    </header>

    <!-- CARRO DE COMPRAS -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        <h1 class="text-3xl font-black text-gray-900 mb-8">Tu Carrito de Compras</h1>

        <div class="flex flex-col lg:flex-row gap-8">
            
            <!-- Lista de Productos -->
            <div class="flex-grow bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden" id="cart-container">
                <div class="p-8 text-center text-gray-500" id="empty-cart-msg" style="display: none;">
                    <i class="fa-solid fa-cart-arrow-down text-6xl text-gray-200 mb-4"></i>
                    <p class="text-xl font-medium text-gray-600">Tu carrito está vacío</p>
                    <a href="home.html" class="mt-6 inline-block bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-3 px-8 rounded-xl transition">Ir a comprar</a>
                </div>
                
                <ul id="cart-list" class="divide-y divide-gray-100">
                    <!-- Items dinámicos -->
                </ul>
            </div>

            <!-- Resumen de Compra -->
            <div class="lg:w-1/3">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sticky top-24">
                    <h2 class="text-xl font-bold text-gray-900 mb-6">Resumen de tu pedido</h2>
                    
                    <div class="flex justify-between mb-4 text-gray-600">
                        <span>Subtotal (<span id="summary-count">0</span> productos)</span>
                        <span id="summary-subtotal" class="font-medium">$0.00</span>
                    </div>
                    
                    <div class="flex justify-between mb-6 text-gray-600">
                        <span>Envío</span>
                        <span class="text-green-500 font-medium">Gratis</span>
                    </div>
                    
                    <div class="border-t border-gray-100 pt-4 mb-6">
                        <div class="flex justify-between items-center">
                            <span class="text-lg font-bold text-gray-900">Total a pagar</span>
                            <span id="summary-total" class="text-3xl font-black text-gray-900">$0.00</span>
                        </div>
                    </div>
                    
                    <button id="btn-checkout" onclick="procederPago()" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-4 rounded-xl transition-colors shadow-lg transform hover:-translate-y-1">
                        Proceder al pago
                    </button>
                    
                    <div class="mt-4 flex items-center justify-center space-x-2 text-gray-400 text-xs">
                        <i class="fa-solid fa-lock"></i>
                        <span>Pago 100% seguro y encriptado</span>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <!-- FOOTER SIMPLE -->
    <footer class="bg-gray-900 py-6 text-center text-sm text-gray-500 mt-auto">
        &copy; 2026 Refresquería Vico. Todos los derechos reservados.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', renderCart);

        function getCartKey() {
            const userId = sessionStorage.getItem('usuarioID') || 'guest';
            return 'vico_cart_' + userId;
        }

        function getCart() {
            const cartStr = localStorage.getItem(getCartKey());
            return cartStr ? JSON.parse(cartStr) : [];
        }

        function saveCart(cart) {
            localStorage.setItem(getCartKey(), JSON.stringify(cart));
            renderCart(); // Re-renderizar después de guardar
        }

        function renderCart() {
            const cart = getCart();
            const listEl = document.getElementById('cart-list');
            const emptyMsg = document.getElementById('empty-cart-msg');
            const btnCheckout = document.getElementById('btn-checkout');

            listEl.innerHTML = '';

            if (cart.length === 0) {
                emptyMsg.style.display = 'block';
                btnCheckout.disabled = true;
                btnCheckout.classList.add('opacity-50', 'cursor-not-allowed');
                updateSummary(0, 0);
                return;
            }

            emptyMsg.style.display = 'none';
            btnCheckout.disabled = false;
            btnCheckout.classList.remove('opacity-50', 'cursor-not-allowed');

            let subtotal = 0;
            let totalItems = 0;

            cart.forEach((item, index) => {
                const p = item.producto;
                subtotal += p.precio * item.cantidad;
                totalItems += item.cantidad;

                const imgUrl = p.urlImagen || 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=500';

                const li = document.createElement('li');
                li.className = 'p-6 flex flex-col sm:flex-row items-center sm:items-start gap-6';
                li.innerHTML = `
                    <div class="h-24 w-24 flex-shrink-0 overflow-hidden rounded-xl bg-gray-50 flex justify-center items-center p-2 border border-gray-100">
                        <img src="${imgUrl}" alt="${p.nombre}" class="h-full object-contain">
                    </div>
                    <div class="flex flex-1 flex-col justify-between w-full">
                        <div class="flex justify-between sm:items-start w-full">
                            <div>
                                <h3 class="text-lg font-bold text-gray-900">${p.nombre}</h3>
                                <p class="mt-1 text-sm text-gray-500">${p.categoria?.nombreCategoria || 'Refrescos'}</p>
                            </div>
                            <p class="text-xl font-black text-gray-900 sm:ml-4">$${(p.precio * item.cantidad).toFixed(2)}</p>
                        </div>
                        <div class="mt-4 flex flex-1 items-center justify-between">
                            <div class="flex items-center border border-gray-200 rounded-lg">
                                <button onclick="changeQuantity(${index}, -1)" class="px-3 py-1 text-gray-600 hover:bg-gray-100 rounded-l-lg transition">-</button>
                                <span class="px-3 py-1 text-gray-900 font-medium">${item.cantidad}</span>
                                <button onclick="changeQuantity(${index}, 1)" class="px-3 py-1 text-gray-600 hover:bg-gray-100 rounded-r-lg transition">+</button>
                            </div>
                            <button type="button" onclick="removeItem(${index})" class="text-sm font-medium text-red-500 hover:text-red-700 flex items-center transition">
                                <i class="fa-regular fa-trash-can mr-1"></i> Eliminar
                            </button>
                        </div>
                    </div>
                `;
                listEl.appendChild(li);
            });

            updateSummary(totalItems, subtotal);
        }

        function changeQuantity(index, delta) {
            let cart = getCart();
            if (cart[index]) {
                cart[index].cantidad += delta;
                if (cart[index].cantidad <= 0) {
                    cart.splice(index, 1);
                }
                saveCart(cart);
            }
        }

        function removeItem(index) {
            Swal.fire({
                title: '¿Eliminar producto?',
                text: "Se quitará de tu carrito de compras.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#eab308',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    let cart = getCart();
                    cart.splice(index, 1);
                    saveCart(cart);
                    Swal.fire({
                        title: 'Eliminado',
                        icon: 'success',
                        toast: true,
                        position: 'bottom-end',
                        showConfirmButton: false,
                        timer: 1500
                    });
                }
            });
        }

        function updateSummary(totalItems, subtotal) {
            document.getElementById('summary-count').innerText = totalItems;
            document.getElementById('summary-subtotal').innerText = '$' + subtotal.toFixed(2);
            document.getElementById('summary-total').innerText = '$' + subtotal.toFixed(2);
        }

        function procederPago() {
            Swal.fire({
                title: '¡Próximamente!',
                text: 'La pasarela de pago no se encuentra disponible por el momento. Estamos trabajando para habilitarla pronto.',
                icon: 'info',
                confirmButtonColor: '#eab308',
                confirmButtonText: 'Entendido'
            });
        }
    </script>
</body>
</html>

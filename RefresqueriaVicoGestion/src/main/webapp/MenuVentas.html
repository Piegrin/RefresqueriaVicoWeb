<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Venta | Refresquería Vico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Scrollbars para el ticket y productos */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <div class="h-20 flex items-center px-8 border-b border-gray-800">
                <i class="fa-solid fa-glass-water text-2xl text-yellow-500 mr-2"></i>
                <span class="text-xl font-black">Admin <span class="text-yellow-500">Vico</span></span>
            </div>
            <nav class="mt-8 px-4 space-y-2">
                <a href="MainMenu.html" class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-800 rounded-xl font-medium transition">
                    <i class="fa-solid fa-chart-pie w-6"></i> Dashboard
                </a>
                <a href="MenuVentas.html" class="flex items-center px-4 py-3 bg-yellow-400 text-gray-900 rounded-xl font-bold transition">
                    <i class="fa-solid fa-cash-register w-6"></i> Punto de Venta
                </a>
                <a href="CorteCaja.html" class="flex items-center text-gray-600 hover:bg-yellow-50 hover:text-yellow-600 rounded-xl px-4 py-3 transition">
                    <i class="fa-solid fa-chart-line w-6"></i> Corte de Caja
                </a>
                <a href="ConsultaProd.html" class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-800 rounded-xl font-medium transition">
                    <i class="fa-solid fa-boxes-stacked w-6"></i> Inventario
                </a>
                <a href="MenuConsultas.html" class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-800 rounded-xl font-medium transition">
                    <i class="fa-solid fa-users-gear w-6"></i> Empleados
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-gray-800">
            <a href="home.html" class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-800 rounded-xl font-medium transition">
                <i class="fa-solid fa-store w-6"></i> Ir a la Tienda
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col h-screen">
        <!-- TOP NAV -->
        <header class="h-20 bg-white shadow-sm flex items-center justify-between px-8 shrink-0">
            <h1 class="text-2xl font-black text-gray-900">Terminal de Venta</h1>
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <input type="text" id="busqueda" placeholder="Buscar producto..." class="pl-10 pr-4 py-2 border border-gray-300 rounded-xl focus:ring-yellow-500 focus:border-yellow-500 w-64 bg-gray-50" oninput="filtrarProductos()">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400"></i>
                </div>
                <select id="categoria" class="border border-gray-300 rounded-xl px-4 py-2 focus:ring-yellow-500 bg-gray-50 text-gray-700" onchange="filtrarProductos()">
                    <option value="">Todas las categorías</option>
                    <option value="Refrescos">Refrescos</option>
                    <option value="Jugos">Jugos</option>
                    <option value="Snacks">Snacks</option>
                </select>
            </div>
        </header>

        <!-- POS LAYOUT -->
        <div class="flex-1 flex overflow-hidden p-6 gap-6 bg-gray-100">
            
            <!-- CATALOG GRID -->
            <div class="flex-1 bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Catálogo de Productos</h2>
                <div id="lista-productos" class="flex-1 overflow-y-auto grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pr-2 content-start">
                    <!-- Productos renderizados aquí -->
                </div>
            </div>

            <!-- TICKET / CART -->
            <div class="w-96 bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col shrink-0 overflow-hidden">
                <div class="p-6 bg-gray-900 text-white">
                    <h2 class="text-xl font-bold flex justify-between items-center">
                        Cuenta Actual
                        <button onclick="cancelarVenta()" class="text-xs bg-red-500 hover:bg-red-600 px-3 py-1 rounded-lg transition"><i class="fa-solid fa-trash mr-1"></i> Cancelar</button>
                    </h2>
                </div>
                
                <div id="listaVenta" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
                    <!-- Items de la venta -->
                    <div class="text-center text-gray-400 mt-10">No hay artículos en la cuenta</div>
                </div>

                <div class="p-6 border-t border-gray-200 bg-white">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-gray-500 font-medium">Subtotal MXN</span>
                        <span class="text-lg font-bold text-gray-900">$<span id="subtotal">0.00</span></span>
                    </div>
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-gray-500 font-medium text-sm">Aprox. USD</span>
                        <span class="text-sm font-bold text-gray-400">$<span id="subtotalUSD">0.00</span></span>
                    </div>
                    <button onclick="pagar()" class="w-full bg-yellow-400 hover:bg-yellow-500 text-gray-900 text-lg font-black py-4 rounded-xl transition shadow-sm flex items-center justify-center">
                        <i class="fa-solid fa-money-bill-wave mr-2"></i> COBRAR
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- PAGO MODAL (Hidden by default) -->
    <div id="modalPago" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
            <h2 class="text-2xl font-black text-gray-900 mb-6 text-center">Confirmar Pago</h2>
            
            <div class="space-y-4">
                <div class="flex justify-between items-center bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <span class="text-gray-600 font-medium">Total a cobrar</span>
                    <span class="text-2xl font-black text-gray-900">$<span id="modalTotal">0.00</span></span>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Moneda</label>
                        <select id="monedaVenta" class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:ring-yellow-500 focus:border-yellow-500" onchange="actualizarModalTotal()">
                            <option value="MXN">Pesos (MXN)</option>
                            <option value="USD">Dólares (USD)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Método</label>
                        <select id="metodoPago" class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:ring-yellow-500 focus:border-yellow-500">
                            <option value="Efectivo">Efectivo</option>
                            <option value="Tarjeta">Tarjeta</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Monto entregado</label>
                    <div class="relative">
                        <span class="absolute left-3 top-2 text-gray-500 font-bold">$</span>
                        <input type="number" id="montoEntregado" class="w-full pl-8 pr-4 py-2 border border-gray-300 rounded-xl focus:ring-yellow-500 text-lg font-bold" oninput="calcularCambio()" placeholder="0.00">
                    </div>
                </div>

                <div class="flex justify-between items-center pt-4 border-t border-gray-100">
                    <span class="text-gray-600 font-bold">Cambio a devolver</span>
                    <span class="text-xl font-black text-green-600">$<span id="cambio">0.00</span></span>
                </div>
            </div>

            <div class="mt-8 flex space-x-4">
                <button onclick="cerrarModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 rounded-xl transition">Cancelar</button>
                <button onclick="confirmarVenta()" class="flex-1 bg-gray-900 hover:bg-black text-white font-bold py-3 rounded-xl transition">Completar Venta</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT (Lógica Visual Adaptada) -->
    <script src="js/auth-guard.js"></script>
    <script>
        const TIPO_CAMBIO = 19.5;
        const venta = [];
        let productosCargados = [];

        function cargarProductos() {
            fetch("api/productos")
                .then(response => response.json())
                .then(data => {
                    productosCargados = data;
                    filtrarProductos();
                }).catch(e => {
                    console.warn("Fallo carga de API, probando sin ruta base...");
                });
        }

        function filtrarProductos() {
            const texto = document.getElementById("busqueda").value.toLowerCase();
            const categoria = document.getElementById("categoria").value;

            const filtrados = productosCargados.filter(p => {
                const nombreCat = (p.categoria && p.categoria.nombreCategoria) ? p.categoria.nombreCategoria : (p.categoria || "");
                const coincideNombre = p.nombre.toLowerCase().includes(texto);
                const coincideCategoria = !categoria || nombreCat === categoria;
                return coincideNombre && coincideCategoria;
            });

            mostrarProductos(filtrados);
        }

        function mostrarProductos(listaProductos) {
            const lista = document.getElementById("lista-productos");
            lista.innerHTML = "";

            if(listaProductos.length === 0) {
                lista.innerHTML = "<p class='col-span-full text-center text-gray-500 mt-10'>No se encontraron productos.</p>";
                return;
            }

            listaProductos.forEach(producto => {
                const id = producto.productoID || producto.id;
                const nombre = producto.nombre;
                const precio = producto.precio || producto.precioVenta;
                const imgUrl = producto.urlImagen || 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=500';

                const div = document.createElement("div");
                div.className = "bg-white border border-gray-200 rounded-xl p-4 cursor-pointer hover:shadow-md hover:border-yellow-400 transition flex flex-col items-center text-center group";
                div.onclick = () => agregarProducto({id, nombre, precio});

                div.innerHTML = `
                    <div class="h-20 w-20 mb-3 flex items-center justify-center overflow-hidden">
                        <img src="${imgUrl}" class="h-full object-contain group-hover:scale-110 transition-transform">
                    </div>
                    <h3 class="text-sm font-bold text-gray-800 line-clamp-2 leading-tight">${nombre}</h3>
                    <p class="text-yellow-600 font-black mt-1">$${precio.toFixed(2)}</p>
                `;
                lista.appendChild(div);
            });
        }

        function agregarProducto(producto) {
            const existente = venta.find(p => p.id === producto.id);
            if (existente) {
                existente.cantidad += 1;
            } else {
                venta.push({ ...producto, cantidad: 1 });
            }
            renderizarVenta();
        }

        function renderizarVenta() {
            const contenedor = document.getElementById("listaVenta");
            contenedor.innerHTML = "";
            if (venta.length === 0) {
                contenedor.innerHTML = '<div class="text-center text-gray-400 mt-10">No hay artículos en la cuenta</div>';
                document.getElementById("subtotal").textContent = "0.00";
                document.getElementById("subtotalUSD").textContent = "0.00";
                return;
            }

            let total = 0;
            venta.forEach((item, index) => {
                total += item.precio * item.cantidad;

                const div = document.createElement("div");
                div.className = "bg-white p-3 rounded-xl border border-gray-200 flex justify-between items-center shadow-sm";

                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="bg-yellow-100 text-yellow-800 font-bold px-2 py-1 rounded-lg text-sm">${item.cantidad}</div>
                        <div>
                            <p class="text-sm font-bold text-gray-900 leading-tight">${item.nombre}</p>
                            <p class="text-xs text-gray-500">$${item.precio.toFixed(2)} c/u</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="font-black text-gray-900">$${(item.precio * item.cantidad).toFixed(2)}</span>
                        <button onclick="eliminarDelCarrito(${index})" class="text-red-400 hover:text-red-600 bg-red-50 hover:bg-red-100 p-2 rounded-lg transition">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                `;
                contenedor.appendChild(div);
            });

            document.getElementById("subtotal").textContent = total.toFixed(2);
            document.getElementById("subtotalUSD").textContent = (total / TIPO_CAMBIO).toFixed(2);
        }

        window.eliminarDelCarrito = function(index) {
            venta.splice(index, 1);
            renderizarVenta();
        }

        function cancelarVenta() {
            if(venta.length === 0) return;
            Swal.fire({
                title: '¿Cancelar Venta?',
                text: "Se borrarán todos los productos de la cuenta.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'Sí, cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    venta.length = 0;
                    renderizarVenta();
                }
            });
        }

        function pagar() {
            if (venta.length === 0) {
                Swal.fire('Cuenta vacía', 'Agrega productos antes de cobrar.', 'warning');
                return;
            }
            document.getElementById("modalPago").style.display = "flex";
            actualizarModalTotal();
        }

        function cerrarModal() {
            document.getElementById("modalPago").style.display = "none";
        }

        function calcularTotal() {
            return venta.reduce((sum, item) => sum + item.precio * item.cantidad, 0);
        }

        function actualizarModalTotal() {
            const moneda = document.getElementById("monedaVenta").value;
            const total = calcularTotal();
            const totalEnMoneda = moneda === "USD" ? (total / TIPO_CAMBIO) : total;
            document.getElementById("modalTotal").textContent = totalEnMoneda.toFixed(2);
            calcularCambio();
        }

        function calcularCambio() {
            const moneda = document.getElementById("monedaVenta").value;
            const monto = parseFloat(document.getElementById("montoEntregado").value) || 0;
            const total = calcularTotal();
            const totalEnMoneda = moneda === "USD" ? (total / TIPO_CAMBIO) : total;
            const cambio = monto - totalEnMoneda;
            document.getElementById("cambio").textContent = cambio >= 0 ? cambio.toFixed(2) : "0.00";
        }

        async function confirmarVenta() {
            const monto = parseFloat(document.getElementById("montoEntregado").value) || 0;
            const totalBase = calcularTotal();
            const moneda = document.getElementById("monedaVenta").value;
            const total = moneda === "USD" ? totalBase / TIPO_CAMBIO : totalBase;

            if (monto < total) {
                Swal.fire('Monto insuficiente', 'El efectivo entregado no cubre el total.', 'error');
                return;
            }

            const ventaEnviar = {
                montoEntregado: monto,
                cambio: Number((monto - total).toFixed(2)),
                moneda: moneda,
                montoTotal: Number(totalBase.toFixed(2)),
                tipoVenta: "PuntoDeVenta",
                estado: "Completada",
                detalles: venta.map(item => ({
                    producto: { productoID: item.id },
                    cantidad: item.cantidad,
                    precioVenta: Number(item.precio.toFixed(2))
                }))
            };

            try {
                const response = await fetch("api/ventas", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(ventaEnviar)
                });

                if (!response.ok) {
                    const errorResp = await response.json();
                    Swal.fire('Error', errorResp.mensaje || "Error al registrar la venta", 'error');
                    return;
                }

                const data = await response.json();
                Swal.fire({
                    title: '¡Venta Exitosa!',
                    text: 'Cambio a entregar: $' + (monto - total).toFixed(2),
                    icon: 'success',
                    confirmButtonColor: '#eab308'
                }).then(() => {
                    venta.length = 0;
                    renderizarVenta();
                    cerrarModal();
                    document.getElementById('montoEntregado').value = '';
                    cargarProductos(); // Recargar productos para actualizar stock
                });
            } catch (error) {
                Swal.fire('Error de conexión', error.message, 'error');
            }
        }

        window.onload = function () {
            if (!verificarAcceso(['Administrador', 'Empleado'])) return;
            cargarProductos();
        };
    </script>
</body>
</html>

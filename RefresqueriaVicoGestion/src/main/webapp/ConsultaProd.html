<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario | Refresquería Vico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col justify-between hidden md:flex">
        <div>
            <div class="h-20 flex items-center px-8 border-b border-gray-800">
                <i class="fa-solid fa-glass-water text-2xl text-yellow-500 mr-2"></i>
                <span class="text-xl font-black">Admin <span class="text-yellow-500">Vico</span></span>
            </div>
            <nav class="mt-8 px-4 space-y-2">
                <a href="MainMenu.html" class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-800 rounded-xl font-medium transition">
                    <i class="fa-solid fa-chart-pie w-6"></i> Dashboard
                </a>
                <a href="MenuVentas.html" class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-800 rounded-xl font-medium transition">
                    <i class="fa-solid fa-cash-register w-6"></i> Punto de Venta
                </a>
                <a href="CorteCaja.html" class="flex items-center text-gray-600 hover:bg-yellow-50 hover:text-yellow-600 rounded-xl px-4 py-3 transition">
                    <i class="fa-solid fa-chart-line w-6"></i> Corte de Caja
                </a>
                <a href="ConsultaProd.html" class="flex items-center px-4 py-3 bg-yellow-400 text-gray-900 rounded-xl font-bold transition">
                    <i class="fa-solid fa-boxes-stacked w-6"></i> Inventario
                </a>
                <a href="MenuConsultas.html" class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-800 rounded-xl font-medium transition">
                    <i class="fa-solid fa-users-gear w-6"></i> Empleados
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-gray-800">
            <a href="home.html" class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-800 rounded-xl font-medium transition">
                <i class="fa-solid fa-store w-6"></i> Ir a la Tienda
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col h-screen overflow-y-auto">
        
        <!-- TOP NAV -->
        <header class="h-20 bg-white shadow-sm flex items-center justify-between px-8 sticky top-0 z-10">
            <h1 class="text-2xl font-black text-gray-900">Gestión de Productos</h1>
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2">
                    <div class="h-10 w-10 bg-yellow-400 rounded-full flex items-center justify-center text-gray-900 font-bold">
                        <i class="fa-solid fa-user-tie"></i>
                    </div>
                    <span class="font-bold text-gray-700 hidden sm:block" id="adminName">Admin</span>
                </div>
            </div>
        </header>

        <!-- DASHBOARD CONTENT -->
        <main class="p-8">
            
            <!-- Controls -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-8 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="relative w-full sm:w-96">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-search text-gray-400"></i>
                    </div>
                    <input type="text" id="buscar" placeholder="Buscar producto..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-xl focus:ring-yellow-500 focus:border-yellow-500">
                </div>
                
                <div class="flex space-x-4 w-full sm:w-auto">
                    <select id="ordenar" class="border border-gray-300 rounded-xl px-4 py-2 focus:ring-yellow-500 focus:border-yellow-500 bg-white">
                        <option value="id">Recientes</option>
                        <option value="nombre">Nombre</option>
                        <option value="precio">Precio</option>
                    </select>
                    <button onclick="document.getElementById('form-container').style.display='block'; window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });" class="bg-gray-900 text-white px-6 py-2 rounded-xl font-bold hover:bg-gray-800 transition flex items-center whitespace-nowrap">
                        <i class="fa-solid fa-plus mr-2"></i> Nuevo
                    </button>
                </div>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-8">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200" id="tablaProductos">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">ID</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Producto</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Precio</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Costo</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Stock</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Categoría</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Vendidos</th>
                                <th class="px-6 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="tbodyProductos">
                            <!-- Filas dinámicas -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Formulario (Oculto por defecto, se usaba para editar) -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8" id="form-container" style="display: none;">
                <h3 class="text-xl font-bold text-gray-900 mb-6">Editor de Producto</h3>
                <form id="formProducto" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <input type="hidden" id="id" />
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nombre</label>
                        <input type="text" id="nombre" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-yellow-500 focus:border-yellow-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Precio</label>
                        <input type="number" id="precio" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-yellow-500 focus:border-yellow-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Costo</label>
                        <input type="number" id="costo" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-yellow-500 focus:border-yellow-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Stock</label>
                        <input type="number" id="stock" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-yellow-500 focus:border-yellow-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Categoría</label>
                        <input type="text" id="categoria" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-yellow-500 focus:border-yellow-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Vendidos</label>
                        <input type="number" id="vendidos" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-yellow-500 focus:border-yellow-500">
                    </div>
                    
                    <div class="col-span-full flex justify-end space-x-4 mt-4">
                        <button type="button" onclick="limpiarFormulario()" class="px-6 py-2 border border-gray-300 rounded-xl text-gray-700 font-bold hover:bg-gray-50 transition">Cancelar</button>
                        <button type="submit" class="px-6 py-2 bg-yellow-400 text-gray-900 rounded-xl font-bold hover:bg-yellow-500 transition">Guardar Producto</button>
                    </div>
                </form>
            </div>
            
        </main>
    </div>

    <script src="js/auth-guard.js"></script>
    <script>
        // Mantiene la lógica visual y script original adaptada al nuevo DOM
        const API_URL = "api/productos"; 
        let productosGlobal = [];

        document.addEventListener("DOMContentLoaded", () => {
            if (!verificarAcceso(['Administrador'])) return;

            cargarProductos();
            document.getElementById("formProducto").addEventListener("submit", guardarProducto);
            document.getElementById("ordenar").addEventListener("change", e => ordenarPor(e.target.value));
            document.getElementById("buscar").addEventListener("input", filtrar);
        });

        async function cargarProductos() {
            try {
                const res = await fetch(API_URL);
                productosGlobal = await res.json();
                renderizarTabla(productosGlobal);
            } catch (error) {
                console.error("Error visual al cargar productos", error);
            }
        }

        function renderizarTabla(productos) {
            const tbody = document.getElementById("tbodyProductos");
            tbody.innerHTML = "";
            if (productos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="px-6 py-8 text-center text-gray-500">No hay productos disponibles.</td></tr>`;
                return;
            }
            productos.forEach(p => {
                // Adaptando nombres a la BD real (productoID, inventario) o al json anterior
                const id = p.productoID || p.id;
                const nombre = p.nombre;
                const precio = p.precio || p.precioVenta;
                const stock = p.inventario || p.stock || 0;
                const categoria = (p.categoria && p.categoria.nombreCategoria) ? p.categoria.nombreCategoria : (p.categoria || "-");

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">#${id}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900">${nombre}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">$${precio}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">-</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${stock > 10 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                ${stock}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${categoria}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">0</td>
                        <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium">
                            <button class="text-blue-600 hover:text-blue-900 mr-3 transition" title="Modificar" onclick='editar(${JSON.stringify(p)})'><i class="fa-solid fa-pen-to-square text-lg"></i></button>
                            <button class="text-red-600 hover:text-red-900 transition" title="Eliminar" onclick='eliminar(${id})'><i class="fa-solid fa-trash-can text-lg"></i></button>
                        </td>
                    </tr>`;
            });
        }

        function editar(p) {
            document.getElementById("form-container").style.display = "block";
            document.getElementById("id").value = p.productoID || p.id;
            document.getElementById("nombre").value = p.nombre;
            document.getElementById("precio").value = p.precio;
            document.getElementById("stock").value = p.inventario || p.stock;
            document.getElementById("categoria").value = (p.categoria && p.categoria.nombreCategoria) ? p.categoria.nombreCategoria : p.categoria;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        async function guardarProducto(e) {
            e.preventDefault();
            
            const producto = {
                id: document.getElementById("id").value || null,
                nombre: document.getElementById("nombre").value,
                precio: parseFloat(document.getElementById("precio").value),
                precioVenta: parseFloat(document.getElementById("precio").value), // Para compatibilidad
                costo: parseFloat(document.getElementById("costo").value) || 0,
                inventario: parseInt(document.getElementById("stock").value),
                stock: parseInt(document.getElementById("stock").value), // Para compatibilidad
                categoria: { nombreCategoria: document.getElementById("categoria").value },
                vendidos: parseInt(document.getElementById("vendidos").value) || 0
            };
            
            // Si hay ID, actualizar (PUT), si no, nuevo (POST)
            const metodo = producto.id ? "PUT" : "POST";
            if (producto.id) producto.productoID = parseInt(producto.id);

            try {
                const res = await fetch(API_URL, {
                    method: metodo,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(producto)
                });

                const data = await res.json();

                if (res.ok && data.mensaje && !data.mensaje.includes("Error")) {
                    Swal.fire({
                        title: '¡Guardado!',
                        text: data.mensaje,
                        icon: 'success',
                        toast: true,
                        position: 'bottom-end',
                        showConfirmButton: false,
                        timer: 2000
                    });
                    limpiarFormulario();
                    cargarProductos();
                } else {
                    Swal.fire('Error', data.mensaje || "Revisa los datos (ej. Nombre duplicado o Precio inválido).", 'error');
                }
            } catch (error) {
                Swal.fire('Error de red', 'No se pudo conectar al servidor.', 'error');
            }
        }

        async function eliminar(id) {
            Swal.fire({
                title: '¿Seguro?',
                text: "Esta acción no se puede deshacer.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'Eliminar',
                cancelButtonText: 'Cancelar'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        // El API original usaba ?id=
                        const res = await fetch(`${API_URL}?id=${id}`, { method: "DELETE" });
                        if (res.ok) {
                            Swal.fire({
                                title: 'Eliminado',
                                text: 'El producto fue eliminado correctamente.',
                                icon: 'success',
                                toast: true,
                                position: 'bottom-end',
                                showConfirmButton: false,
                                timer: 2000
                            });
                            cargarProductos();
                        } else {
                            const err = await res.text();
                            Swal.fire('Error', 'No se pudo eliminar: ' + err, 'error');
                        }
                    } catch (e) {
                        Swal.fire('Error de red', 'Fallo de conexión.', 'error');
                    }
                }
            });
        }

        function limpiarFormulario() {
            document.getElementById("formProducto").reset();
            document.getElementById("id").value = "";
            document.getElementById("form-container").style.display = "none";
        }

        function ordenarPor(campo) {
            // Logica simplificada visual
            cargarProductos();
        }

        function filtrar() {
            const valor = document.getElementById("buscar").value.toLowerCase();
            const filtrados = productosGlobal.filter(p =>
                p.nombre.toLowerCase().includes(valor)
            );
            renderizarTabla(filtrados);
        }
    </script>
</body>
</html>
